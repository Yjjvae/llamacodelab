name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify change scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|docs/*|LICENSE|LICENSE.*) ;;
              *)
                code=true
                break
                ;;
            esac
          done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")

          git diff --check "$BASE_SHA" "$HEAD_SHA"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "C++ quality matrix required: $code" >> "$GITHUB_STEP_SUMMARY"

  format:
    name: format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify preinstalled formatter
        run: clang-format --version
      - name: Check format
        run: ./scripts/format.sh --check

  build-test:
    name: build-test (${{ matrix.compiler }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify preinstalled toolchain
        run: |
          cmake --version
          ninja --version
          gcc --version
          g++ --version
          clang --version
          clang++ --version
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure without ccache
        run: >
          cmake --preset dev
          -DCMAKE_CXX_COMPILER_LAUNCHER=
          -DCMAKE_CUDA_COMPILER_LAUNCHER=
          -DGGML_CCACHE=OFF
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  sanitizers:
    name: asan-ubsan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify preinstalled toolchain
        run: |
          cmake --version
          ninja --version
          gcc --version
          g++ --version
      - name: Configure without ccache
        run: >
          cmake --preset asan
          -DCMAKE_CXX_COMPILER_LAUNCHER=
          -DCMAKE_CUDA_COMPILER_LAUNCHER=
          -DGGML_CCACHE=OFF
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan

  tidy:
    name: clang-tidy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify preinstalled toolchain
        run: |
          cmake --version
          ninja --version
          g++ --version
          clang-tidy --version
      - name: Configure without ccache
        run: >
          cmake --preset dev
          -DCMAKE_CXX_COMPILER_LAUNCHER=
          -DCMAKE_CUDA_COMPILER_LAUNCHER=
          -DGGML_CCACHE=OFF
      - name: Check project sources
        run: ./scripts/tidy.sh dev

  required:
    name: required
    if: always()
    needs: [changes, format, build-test, sanitizers, tidy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
          TIDY_RESULT: ${{ needs.tidy.result }}
        run: |
          set -euo pipefail
          for result in \
            "$CHANGES_RESULT" \
            "$FORMAT_RESULT" \
            "$BUILD_TEST_RESULT" \
            "$SANITIZERS_RESULT" \
            "$TIDY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
