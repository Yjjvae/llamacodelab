name: ci

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify preinstalled formatter
        run: clang-format --version
      - name: Check format
        run: ./scripts/format.sh --check

  build-test:
    name: build-test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify preinstalled toolchain
        run: |
          cmake --version
          ninja --version
          gcc --version
          g++ --version
          clang --version
          clang++ --version
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure without ccache
        run: >
          cmake --preset dev
          -DCMAKE_CXX_COMPILER_LAUNCHER=
          -DCMAKE_CUDA_COMPILER_LAUNCHER=
          -DGGML_CCACHE=OFF
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  sanitizers:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify preinstalled toolchain
        run: |
          cmake --version
          ninja --version
          gcc --version
          g++ --version
      - name: Configure without ccache
        run: >
          cmake --preset asan
          -DCMAKE_CXX_COMPILER_LAUNCHER=
          -DCMAKE_CUDA_COMPILER_LAUNCHER=
          -DGGML_CCACHE=OFF
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify preinstalled toolchain
        run: |
          cmake --version
          ninja --version
          g++ --version
          clang-tidy --version
      - name: Configure without ccache
        run: >
          cmake --preset dev
          -DCMAKE_CXX_COMPILER_LAUNCHER=
          -DCMAKE_CUDA_COMPILER_LAUNCHER=
          -DGGML_CCACHE=OFF
      - name: Check project sources
        run: ./scripts/tidy.sh dev
