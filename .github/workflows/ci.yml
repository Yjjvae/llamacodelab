name: ci

# Actions billing is currently unavailable for this private repository. Keep the
# workflow for reproducibility, but require an explicit manual dispatch until
# account billing is restored.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify preinstalled formatter
        run: clang-format --version
      - name: Check format
        run: ./scripts/format.sh --check

  build-test:
    name: build-test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify preinstalled toolchain
        run: |
          cmake --version
          ninja --version
          ccache --version
          gcc --version
          g++ --version
          clang --version
          clang++ --version
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  sanitizers:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify preinstalled toolchain
        run: |
          cmake --version
          ninja --version
          ccache --version
          gcc --version
          g++ --version
      - name: Configure, build, and test
        run: cmake --workflow --preset asan

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify preinstalled toolchain
        run: |
          cmake --version
          ninja --version
          ccache --version
          g++ --version
          clang-tidy --version
      - name: Configure
        run: cmake --preset dev
      - name: Check project sources
        run: ./scripts/tidy.sh dev
